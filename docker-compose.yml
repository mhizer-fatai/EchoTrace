version: '3.8'

services:
  hydradb:
    image: ghcr.io/hydra-db/hydradb:latest
    container_name: echotrace-hydradb
    restart: unless-stopped
    ports:
      - "7687:7687"   # Bolt protocol
      - "8443:8443"   # HTTPS REST API
    environment:
      - RUST_LOG=info
      - HYDRADB_HTTP_PORT=8443
      - HYDRADB_BOLT_PORT=7687
      - HYDRADB_ALLOW_PLAINTEXT_AUTH=true
      - HYDRADB_AUTH_TOKEN=local-development-token-32-bytes
    volumes:
      - hydradb_data:/var/lib/hydradb/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8443/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  echotrace:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: echotrace-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ECHOTRACE_HOST=0.0.0.0
      - ECHOTRACE_PORT=8000
      - HYDRADB_BOLT_URI=bolt://hydradb:7687
      - HYDRADB_AUTH_TOKEN=local-development-token-32-bytes
      - HYDRADB_ALLOW_PLAINTEXT=true
      - USE_IN_MEMORY_FALLBACK=true
    depends_on:
      hydradb:
        condition: service_healthy

volumes:
  hydradb_data:
    driver: local
